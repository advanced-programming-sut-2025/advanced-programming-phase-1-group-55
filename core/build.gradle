// ===== Java Toolchain =====
java {
  toolchain {
    // اینجا نسخه جاوا رو مشخص کن (۲۳ یا ۲۱ یا ۱۷)
    languageVersion.set(JavaLanguageVersion.of(23))
  }
}

// ===== تنظیمات کامپایل =====
tasks.withType(JavaCompile).configureEach {
  options.release.set(23) // باید با نسخه جاوا همخوانی داشته باشه
  options.encoding = 'UTF-8'
}

// ===== تنظیم نام پروژه در Eclipse =====
eclipse.project.name = appName + '-core'

// ===== وابستگی‌ها =====
dependencies {
  // --- API dependencies ---
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.kotcrab.vis:vis-ui:$visUiVersion"
  api "io.github.libktx:ktx-freetype:$ktxVersion"
  api "com.github.MrStahlfelge.gdx-websockets:core:$websocketVersion"

  // --- Implementation dependencies ---
  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
  implementation "com.google.code.gson:gson:2.10.1"
  implementation "org.reflections:reflections:0.10.2"
  implementation "com.esotericsoftware:kryonet:2.22.0-RC1"
  implementation "com.esotericsoftware:kryo:5.6.2"

  // --- Optional GraalVM Native Image Support ---
  if (enableGraalNative) {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}
